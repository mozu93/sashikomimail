name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "作成する既存タグ（例: v1.0.0）"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean sashikomi_mail.spec
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/setup.iss
      - name: Resolve artifact name
        id: artifact
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          $source = Get-ChildItem installer_output\SashikomiMail-Setup-*.exe |
            Select-Object -First 1
          $name = "SashikomiMail-Setup-$tag.exe"
          Copy-Item -LiteralPath $source.FullName -Destination $name
          $checksumName = "$name.sha256"
          $hash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumName -Value "$hash *$name" -Encoding ascii -NoNewline
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "checksum_name=$checksumName" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: SashikomiMail-Windows-${{ steps.artifact.outputs.tag }}
          path: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.checksum_name }}
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.artifact.outputs.tag }}"
          $asset = "${{ steps.artifact.outputs.name }}"
          $checksum = "${{ steps.artifact.outputs.checksum_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $checksum --clobber
          } else {
            gh release create $tag $asset $checksum --title "SashikomiMail $tag" --notes-file RELEASE_NOTES.md
          }
